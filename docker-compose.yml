services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcepilot}
      POSTGRES_USER: ${POSTGRES_USER:-sourcepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcepilot}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-sourcepilot_test}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
