name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: |
          if ! docker compose up -d --wait --wait-timeout 60 postgres; then
            docker compose ps
            docker compose logs postgres
            exit 1
          fi
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Check web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --dev --locked
      - name: Check API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://sourcepilot:sourcepilot@localhost:5432/sourcepilot
          TEST_DATABASE_URL: postgresql+psycopg://sourcepilot:sourcepilot@localhost:5432/sourcepilot_test
        run: |
          uv run ruff check .
          uv run pyright
          uv run pytest
