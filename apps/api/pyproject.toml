[project]
name = "sourcepilot-api"
version = "0.1.0"
description = "SourcePilot API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<9",
    "pyright>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["sourcepilot", "tests"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py311"
